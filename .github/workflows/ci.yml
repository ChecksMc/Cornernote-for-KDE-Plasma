name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - '*.sh'
      - 'corner-note'
      - 'config.example.json'
      - 'cornernote.desktop'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-pytest
      - name: Check syntax
        env:
          PATH: /usr/bin:/bin
        run: |
          python3 -m compileall -q src tests packaging
          python3 -c 'import sys; compile(open(sys.argv[1]).read(), sys.argv[1], "exec")' corner-note
          bash -n install.sh uninstall.sh
      # The headless suite exercises non-GTK modules and needs no display.
      - name: Run headless tests
        env:
          PATH: /usr/bin:/bin
        run: python3 -m pytest tests/

  gtk-tests:
    # GTK UI tests mock layer-shell calls, so a plain X server is enough.
    # Non-blocking until the suite has a track record on hosted runners;
    # CONTRIBUTING.md documents the Broadway setup it was written against.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-gtklayershell-0.1 python3-pytest xvfb
      - name: Run GTK tests
        env:
          PATH: /usr/bin:/bin
          CORNERNOTE_GTK_TESTS: '1'
        run: xvfb-run -a python3 -m pytest tests/test_gtk_ui.py tests/test_update_gtk.py
